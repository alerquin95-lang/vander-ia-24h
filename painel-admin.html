<!DOCTYPE html>
<html lang="pt-BR">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Administrativo Vander</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;color:#e9edf5;font-family:'Inter',system-ui,Arial,sans-serif;padding:14px;min-height:100vh;background:#05070d;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-2;background:radial-gradient(650px 420px at 12% -5%,rgba(139,92,246,.16),transparent 60%),radial-gradient(750px 500px at 92% 8%,rgba(15,102,255,.10),transparent 60%),#05070d}
.container{max-width:900px;margin:auto}
.glass{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0) 24%),rgba(10,15,29,.88);border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:22px;margin-bottom:14px}
.header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:14px}
.logo{font-size:24px;font-weight:800;letter-spacing:-.5px;font-family:'Sora','Inter',sans-serif;color:#f4f6fb}
.logo span{background:linear-gradient(120deg,#c4b5fd,#8b5cf6 40%,#0f66ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.admin-badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:2px;color:#1a1206;background:linear-gradient(135deg,#fde68a,#ffc400);padding:4px 10px;border-radius:7px;vertical-align:middle;margin-left:8px}
.label{color:#8b93a9;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px}
.sectionTitle{display:flex;align-items:center;gap:9px;font-size:12px;color:#cdd5e4;font-weight:800;margin-bottom:14px;text-transform:uppercase;letter-spacing:1.6px;font-family:'Sora','Inter',sans-serif}
.sectionTitle::before{content:'';width:4px;height:17px;border-radius:4px;background:linear-gradient(180deg,#fde68a,#ffc400);flex:none}
.muted{color:#64748b;font-size:11px}
/* login */
#loginScreen{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(650px 420px at 12% -5%,rgba(139,92,246,.16),transparent 60%),#05070d}
.login-card{width:100%;max-width:380px;background:rgba(10,15,29,.95);border:1px solid rgba(255,196,0,.25);border-radius:24px;padding:38px 32px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:popIn .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes popIn{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.login-input{width:100%;padding:14px 16px;margin:7px 0;border-radius:12px;background:rgba(2,6,23,.65);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:14px;outline:none;font-family:'Inter',sans-serif}
.login-input:focus{border-color:#ffc400}
.login-btn{width:100%;padding:15px;margin-top:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#fde68a,#ffc400);color:#1a1206;font-weight:800;font-size:15px;letter-spacing:1px;cursor:pointer}
#loginError{display:none;margin-top:12px;padding:10px;border-radius:10px;background:rgba(255,26,26,.1);border:1px solid rgba(255,26,26,.3);color:#ff7a7a;font-size:12px;font-weight:700}
/* form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
.field label{display:block;margin-bottom:6px}
.add-btn{width:100%;padding:15px;margin-top:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-weight:800;font-size:15px;letter-spacing:1px;cursor:pointer;transition:transform .15s}
.add-btn:hover{transform:translateY(-1px)}
#formMsg{display:none;margin-top:12px;padding:10px;border-radius:10px;font-size:12px;font-weight:700}
/* users */
.user-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(2,6,23,.55);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:14px 16px;margin-bottom:10px;animation:riseIn .4s cubic-bezier(.2,.7,.3,1)}
@keyframes riseIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
.user-ava{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,#8b5cf6,#0f66ff);flex:none;font-family:'Sora',sans-serif}
.rm-btn{background:rgba(255,26,26,.12);border:1px solid rgba(255,26,26,.35);color:#ff7a7a;padding:8px 16px;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer;transition:all .15s;flex:none}
.rm-btn:hover{background:rgba(255,26,26,.25)}
.stat-card{padding:18px;border-radius:18px;background:rgba(10,15,29,.8);border:1px solid rgba(255,255,255,.07);text-align:center}
.stat-num{font-size:30px;font-weight:800;font-family:'Sora',sans-serif}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
.pulse-dot{width:9px;height:9px;border-radius:50%;display:inline-block;animation:dotPulse 1.6s infinite;background:#10b981}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="logo" style="font-size:24px;margin-bottom:6px">Painel Administrativo <span>Vander</span></div>
    <div class="label" style="margin-bottom:22px">Acesso do administrador</div>
    <input id="admUser" class="login-input" placeholder="Login" autocomplete="username" onkeydown="if(event.key==='Enter')admLogin()">
    <input id="admPass" class="login-input" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')admLogin()">
    <div id="loginError"></div>
    <button class="login-btn" onclick="admLogin()">ENTRAR</button>
  </div>
</div>

<div class="container" id="adminPanel" style="display:none">
  <div class="glass header">
    <div>
      <div class="logo">Painel Administrativo <span>Vander</span><span class="admin-badge">ADMIN</span></div>
      <div class="muted" style="margin-top:6px"><span class="pulse-dot"></span> conectado à IA · <span id="admEmail"></span></div>
    </div>
    <button onclick="admLogout()" style="background:rgba(255,26,26,.1);border:1px solid rgba(255,26,26,.3);color:#ff7a7a;padding:8px 18px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer">Sair</button>
  </div>

  <div class="grid2">
    <div class="stat-card"><div class="label">Usuários ativos</div><div class="stat-num" id="statUsers" style="color:#10b981">0</div></div>
    <div class="stat-card"><div class="label">Status da conexão</div><div class="stat-num" style="font-size:16px;color:#10b981;margin-top:8px">● SINCRONIZADO</div><div class="muted">mesmo banco da IA</div></div>
  </div>

  <div class="glass">
    <div class="sectionTitle">Adicionar novo usuário</div>
    <div class="form-grid">
      <div class="field"><label class="label">Nome do usuário</label><input id="newUser" class="login-input" style="margin:0" placeholder="ex: joao.silva" autocomplete="off"></div>
      <div class="field"><label class="label">Senha</label><input id="newPass" class="login-input" style="margin:0" type="password" placeholder="senha do usuário" autocomplete="new-password"></div>
    </div>
    <button class="add-btn" onclick="addUser()">+ ADICIONAR USUÁRIO</button>
    <div id="formMsg"></div>
  </div>

  <div class="glass">
    <div class="sectionTitle">Usuários cadastrados</div>
    <div id="userList"><div class="muted" style="text-align:center;padding:20px">Carregando...</div></div>
  </div>

  <div style="text-align:center;margin:20px 0;color:#475569;font-size:11px">
    Alterações refletem na tela de login da IA automaticamente
  </div>
</div>

<script>
/* ===== MESMO BANCO DA IA ===== */
const LS_USERS='vander_users_v1', LS_ADM='vander_adm_session_v1';
const ADMIN_USER='santarosavander@gmail.com', ADMIN_PASS='131619jV*';

function loadUsers(){
  try{
    const u=JSON.parse(localStorage.getItem(LS_USERS)||'null');
    if(Array.isArray(u)&&u.length) return u;
  }catch(e){}
  const seed=[{user:ADMIN_USER,pass:ADMIN_PASS,name:'Admin',created:Date.now()}];
  try{ localStorage.setItem(LS_USERS,JSON.stringify(seed)); }catch(e){}
  return seed;
}
function saveUsers(list){ try{ localStorage.setItem(LS_USERS,JSON.stringify(list)); }catch(e){} }

/* ===== LOGIN ADMIN ===== */
function admLogin(){
  const u=document.getElementById('admUser').value.trim();
  const p=document.getElementById('admPass').value;
  const err=document.getElementById('loginError');
  if(u===ADMIN_USER&&p===ADMIN_PASS){
    err.style.display='none';
    try{ localStorage.setItem(LS_ADM,JSON.stringify({at:Date.now()})); }catch(e){}
    showPanel();
  } else {
    err.textContent='Login ou senha do administrador incorretos';
    err.style.display='block';
  }
}
function admLogout(){
  try{ localStorage.removeItem(LS_ADM); }catch(e){}
  location.reload();
}
function showPanel(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('adminPanel').style.display='block';
  document.getElementById('admEmail').textContent=ADMIN_USER;
  renderUsers();
}

/* ===== GERENCIAR USUÁRIOS ===== */
function msg(t,ok){
  const el=document.getElementById('formMsg');
  el.textContent=t;
  el.style.display='block';
  el.style.background=ok?'rgba(16,185,129,.1)':'rgba(255,26,26,.1)';
  el.style.border='1px solid '+(ok?'rgba(16,185,129,.3)':'rgba(255,26,26,.3)');
  el.style.color=ok?'#10b981':'#ff7a7a';
  setTimeout(function(){ el.style.display='none'; },4000);
}
function addUser(){
  const u=document.getElementById('newUser').value.trim();
  const p=document.getElementById('newPass').value;
  if(!u||!p){ msg('Preencha o nome do usuário e a senha',false); return; }
  if(u.length<3){ msg('Nome de usuário muito curto (mín. 3 letras)',false); return; }
  if(p.length<4){ msg('Senha muito curta (mín. 4 caracteres)',false); return; }
  const users=loadUsers();
  if(users.find(function(x){return x.user.toLowerCase()===u.toLowerCase();})){ msg('Esse usuário já existe',false); return; }
  users.push({user:u,pass:p,name:u,created:Date.now()});
  saveUsers(users);
  document.getElementById('newUser').value='';
  document.getElementById('newPass').value='';
  msg('Usuário "'+u+'" adicionado — já pode entrar na IA',true);
  renderUsers();
}
function removeUser(u){
  if(u===ADMIN_USER){ msg('Não é possível remover o administrador',false); return; }
  if(!confirm('Remover o usuário "'+u+'"? Ele perderá o acesso à IA imediatamente.')) return;
  saveUsers(loadUsers().filter(function(x){return x.user!==u;}));
  msg('Usuário "'+u+'" removido',true);
  renderUsers();
}
function renderUsers(){
  const users=loadUsers();
  document.getElementById('statUsers').textContent=users.length;
  const list=document.getElementById('userList');
  if(!users.length){
    list.innerHTML='<div class="muted" style="text-align:center;padding:20px">Nenhum usuário</div>';
    return;
  }
  list.innerHTML=users.map(function(x){
    const isAdm=x.user===ADMIN_USER;
    const d=x.created?new Date(x.created).toLocaleDateString('pt-BR'):'—';
    return '<div class="user-row">'+
      '<div style="display:flex;align-items:center;gap:12px;min-width:0">'+
        '<div class="user-ava">'+x.user.charAt(0).toUpperCase()+'</div>'+
        '<div style="min-width:0"><div style="font-weight:800;overflow:hidden;text-overflow:ellipsis">'+x.user+(isAdm?' <span class="admin-badge">ADMIN</span>':'')+'</div>'+
        '<div class="muted">criado em '+d+'</div></div>'+
      '</div>'+
      (isAdm?'<span class="muted">protegido</span>':'<button class="rm-btn" onclick="removeUser(\''+x.user.replace(/'/g,"\\'")+'\')">Remover</button>')+
    '</div>';
  }).join('');
}

/* ===== SESSÃO ===== */
(function(){
  try{
    const s=JSON.parse(localStorage.getItem(LS_ADM)||'null');
    if(s&&s.at) showPanel();
  }catch(e){}
})();
document.getElementById('newPass').addEventListener('keydown',function(e){ if(e.key==='Enter') addUser(); });
document.getElementById('newUser').addEventListener('keydown',function(e){ if(e.key==='Enter') addUser(); });
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
