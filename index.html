        :root{--bg:#0e0e12;--card:#18181d;--card2:#1f1f26;--line:rgba(255,255,255,.08);--gold:#FFD60A;--blue:#3B82F6;--red:#EF4444;--green:#22C55E;--gold-glow:rgba(255,214,10,.18)}
        *{box-sizing:border-box}

        /* LOGIN SCREEN - premium tech com partículas igual index-pronto */
        #loginScreen{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;background:#0c0c10;overflow:hidden}
        #loginCanvas{position:absolute;inset:0;width:100%;height:100%}
        .login-overlay{position:absolute;inset:0;background:radial-gradient(800px 600px at 50% 50%, rgba(12,12,16,.2), rgba(12,12,16,.88) 70%), linear-gradient(180deg, rgba(255,214,10,.06) 0%, transparent 40%, rgba(139,92,246,.04) 100%);pointer-events:none}
        .login-card{position:relative;z-index:2;width:100%;max-width:400px;background:rgba(24,24,29,.88);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.10);border-radius:28px;padding:36px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06) inset, 0 0 100px rgba(255,214,10,.08);animation:loginIn .9s cubic-bezier(.16,1,.3,1)}
        @keyframes loginIn{from{transform:translateY(32px) scale(.92);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
        .login-logo{font-family:Syne,sans-serif;font-size:32px;font-weight:800;letter-spacing:-1px;background:linear-gradient(100deg, #fff 20%, var(--gold) 80%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;position:relative;display:inline-block}
        .login-logo::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:80px;height:2px;background:linear-gradient(90deg, transparent, var(--gold), transparent);animation:logoLine 3s ease-in-out infinite}
