        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@600;700&display=swap');
        :root{--bg:#0e0e12;--card:#18181d;--card2:#1f1f26;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--gold:#FFD60A;--blue:#3B82F6;--red:#EF4444;--green:#22C55E;--gold-glow:rgba(255,214,10,.18)}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:#fff;font-family:Inter,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
        .app-root{min-height:100vh;background:var(--bg);position:relative;color:#fff;font-family:Inter,sans-serif}
        .app-root::before{content:'';position:fixed;inset:0;background:radial-gradient(800px 500px at 50% -10%, rgba(255,214,10,.10), transparent 60%), radial-gradient(600px 400px at 80% 20%, rgba(139,92,246,.06), transparent 50%);pointer-events:none;z-index:0}
        /* LOADING */
        .loading-screen{position:fixed;inset:0;z-index:10001;display:flex;align-items:center;justify-content:center;padding:20px;background:#0a0a0f;overflow:hidden}
        .loading-canvas{position:absolute;inset:0;width:100%;height:100%}
        .loading-overlay{position:absolute;inset:0;background:radial-gradient(900px 700px at 50% 50%, rgba(10,10,15,.3), rgba(10,10,15,.92) 70%), linear-gradient(180deg, rgba(255,214,10,.04) 0%, transparent 50%, rgba(139,92,246,.03) 100%);pointer-events:none}
        .loading-content{position:relative;z-index:2;text-align:center;max-width:400px;width:100%}
        .loading-logo{width:64px;height:64px;margin:0 auto 20px;border-radius:16px;background:linear-gradient(135deg, var(--gold), #ff8c00);display:flex;align-items:center;justify-content:center;font-family:Syne,sans-serif;font-weight:800;color:#000;font-size:26px;box-shadow:0 12px 32px rgba(255,214,10,.3), 0 0 0 1px rgba(255,214,10,.2) inset;animation:logoFloat 2s ease-in-out infinite}
        @keyframes logoFloat{0%,100%{transform:translateY(0) scale(1);box-shadow:0 12px 32px rgba(255,214,10,.3)}50%{transform:translateY(-4px) scale(1.02);box-shadow:0 16px 40px rgba(255,214,10,.4)}}
        .loading-title{font-family:Syne,sans-serif;font-weight:800;font-size:18px;letter-spacing:-0.5px;margin-bottom:6px}
        .loading-title b{color:var(--gold)}
        .loading-sub{font-size:10px;letter-spacing:2px;color:#888;font-weight:600;margin-bottom:32px}
        .loading-steps{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
        .loading-step{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);text-align:left;opacity:.4;transition:all .5s cubic-bezier(.16,1,.3,1);transform:translateX(-10px)}
        .loading-step.active{opacity:1;transform:translateX(0);background:rgba(255,214,10,.08);border-color:rgba(255,214,10,.20);box-shadow:0 4px 16px rgba(255,214,10,.1)}
        .loading-step.done{opacity:.7;background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.15)}
        .loading-step .icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:.3s}
        .loading-step .icon.pending{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#666}
        .loading-step.active .icon{animation:iconSpin 1s linear infinite;background:rgba(255,214,10,.15);border-color:rgba(255,214,10,.25);color:var(--gold)}
        .loading-step.done .icon{background:var(--green);border-color:var(--green);color:#000;animation:none}
        @keyframes iconSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        .loading-step .text{flex:1}
        .loading-step .text .title{font-size:12px;font-weight:700;color:#fff}
        .loading-step .text .sub{font-size:9px;color:#888;margin-top:2px}
        .loading-step .check{width:20px;height:20px;border-radius:50%;background:var(--green);color:#000;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;opacity:0;transform:scale(0);transition:.4s cubic-bezier(.16,1,.3,1)}
        .loading-step.done .check{opacity:1;transform:scale(1)}
        .loading-bar{height:3px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-bottom:12px}
        .loading-bar-fill{height:100%;background:linear-gradient(90deg, var(--gold), #ff9500);border-radius:99px;transition:width .5s cubic-bezier(.16,1,.3,1);box-shadow:0 0 10px rgba(255,214,10,.4)}
        .loading-pct{font-family:JetBrains Mono,sans-serif;font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1px}
        /* LOGIN */
        .login-screen{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;background:#0c0c10;overflow:hidden}
        .login-canvas{position:absolute;inset:0;width:100%;height:100%}
        .login-overlay{position:absolute;inset:0;background:radial-gradient(800px 600px at 50% 50%, rgba(12,12,16,.2), rgba(12,12,16,.88) 70%), linear-gradient(180deg, rgba(255,214,10,.06) 0%, transparent 40%, rgba(139,92,246,.04) 100%);pointer-events:none}
        .login-card{position:relative;z-index:2;width:100%;max-width:400px;background:rgba(24,24,29,.88);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.10);border-radius:28px;padding:36px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06) inset, 0 0 100px rgba(255,214,10,.08);animation:loginIn .9s cubic-bezier(.16,1,.3,1)}
        @keyframes loginIn{from{transform:translateY(32px) scale(.92);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
        .login-logo{font-family:Syne,sans-serif;font-size:32px;font-weight:800;letter-spacing:-1px;background:linear-gradient(100deg, #fff 20%, var(--gold) 80%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;position:relative;display:inline-block}
        .login-logo::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:80px;height:2px;background:linear-gradient(90deg, transparent, var(--gold), transparent);animation:logoLine 3s ease-in-out infinite}
        @keyframes logoLine{0%,100%{opacity:.4;transform:translateX(-50%) scaleX(.5)}50%{opacity:1;transform:translateX(-50%) scaleX(1)}}
        .login-sub{font-size:10px;letter-spacing:3px;color:#777;margin:10px 0 28px;font-weight:600}
        .login-input{width:100%;padding:16px 18px;margin:10px 0;border-radius:16px;background:rgba(14,14,18,.9);border:1px solid rgba(255,255,255,.10);color:#fff;outline:none;font-size:14px;transition:.25s;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.2) inset}
        .login-input::placeholder{color:#666}
        .login-input:focus{border-color:rgba(255,214,10,.35);background:rgba(18,18,22,.95);box-shadow:0 0 0 4px rgba(255,214,10,.08), 0 4px 16px rgba(0,0,0,.3) inset, 0 0 20px rgba(255,214,10,.08)}
        .login-btn{width:100%;padding:16px;margin-top:18px;border:none;border-radius:16px;background:linear-gradient(135deg, var(--gold), #ff9500);color:#000;font-weight:800;font-size:13px;letter-spacing:1px;cursor:pointer;box-shadow:0 10px 28px rgba(255,214,10,.28);transition:.2s}
        .login-btn:hover{transform:translateY(-1px);box-shadow:0 14px 32px rgba(255,214,10,.35)}
        .login-error{margin-top:12px;padding:10px;border-radius:12px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#ff7a7a;font-size:11px;font-weight:600;display:none}
        .login-error.show{display:block}

        .top{position:sticky;top:0;z-index:40;backdrop-filter:blur(20px);background:rgba(14,14,18,.82);border-bottom:1px solid var(--line)}

        .brand{font-family:Syne,sans-serif;font-weight:700;font-size:13px;letter-spacing:-0.2px}
        .brand b{color:var(--gold)}
        .top-status{font-size:10px;color:#888;font-weight:600;letter-spacing:0.5px;font-family:JetBrains Mono,sans-serif}
        .tabs{max-width:1000px;margin:0 auto;padding:0 20px;display:flex;gap:8px;position:sticky;top:56px;z-index:30;background:linear-gradient(180deg, rgba(14,14,18,.9), rgba(14,14,18,0));backdrop-filter:blur(20px);padding-top:12px;padding-bottom:12px}
        .tab{padding:9px 18px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:11px;font-weight:700;cursor:pointer;transition:.2s;color:#888}
        .tab.active{background:linear-gradient(135deg, var(--gold), #ff9500);color:#000;border-color:var(--gold);box-shadow:0 6px 18px rgba(255,214,10,.25)}
