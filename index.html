        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@600;700&display=swap');
        :root{--bg:#0e0e12;--card:#18181d;--card2:#1f1f26;--line:rgba(255,255,255,.08);--gold:#FFD60A;--blue:#3B82F6;--red:#EF4444;--green:#22C55E;--gold-glow:rgba(255,214,10,.18)}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:#fff;font-family:Inter,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
        .app-root{min-height:100vh;background:var(--bg);position:relative;color:#fff;font-family:Inter,sans-serif}
        .app-root::before{content:'';position:fixed;inset:0;background:radial-gradient(800px 500px at 50% -10%, rgba(255,214,10,.09), transparent 60%), radial-gradient(600px 400px at 80% 20%, rgba(139,92,246,.05), transparent 50%);pointer-events:none;z-index:0}
        /* LOGIN SCREEN - premium tech com partículas igual index-pronto */
        #loginScreen{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;background:#0c0c10;overflow:hidden}
        #loginCanvas{position:absolute;inset:0;width:100%;height:100%}
        .login-overlay{position:absolute;inset:0;background:radial-gradient(800px 600px at 50% 50%, rgba(12,12,16,.2), rgba(12,12,16,.88) 70%), linear-gradient(180deg, rgba(255,214,10,.06) 0%, transparent 40%, rgba(139,92,246,.04) 100%);pointer-events:none}
        .login-card{position:relative;z-index:2;width:100%;max-width:400px;background:rgba(24,24,29,.88);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.10);border-radius:28px;padding:36px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06) inset, 0 0 100px rgba(255,214,10,.08);animation:loginIn .9s cubic-bezier(.16,1,.3,1)}
        @keyframes loginIn{from{transform:translateY(32px) scale(.92);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
        .login-logo{font-family:Syne,sans-serif;font-size:32px;font-weight:800;letter-spacing:-1px;background:linear-gradient(100deg, #fff 20%, var(--gold) 80%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;position:relative;display:inline-block}
        .login-logo::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:80px;height:2px;background:linear-gradient(90deg, transparent, var(--gold), transparent);animation:logoLine 3s ease-in-out infinite}
        @keyframes logoLine{0%,100%{opacity:.4;transform:translateX(-50%) scaleX(.5)}50%{opacity:1;transform:translateX(-50%) scaleX(1)}}
        .login-sub{font-size:10px;letter-spacing:3px;color:#777;margin:10px 0 28px;font-weight:600}
        .login-input{width:100%;padding:16px 18px;margin:10px 0;border-radius:16px;background:rgba(14,14,18,.9);border:1px solid rgba(255,255,255,.10);color:#fff;outline:none;font-size:14px;transition:.25s;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.2) inset}
        .login-input::placeholder{color:#666}
        .login-input:focus{border-color:rgba(255,214,10,.35);background:rgba(18,18,22,.95);box-shadow:0 0 0 4px rgba(255,214,10,.08), 0 4px 16px rgba(0,0,0,.3) inset, 0 0 20px rgba(255,214,10,.08)}
        .login-btn{width:100%;padding:16px;margin-top:20px;border:none;border-radius:16px;background:linear-gradient(100deg, #FFD60A, #ffaa00);color:#000;font-weight:800;font-size:15px;cursor:pointer;transition:.25s;letter-spacing:.3px;box-shadow:0 6px 20px rgba(255,214,10,.3), 0 0 0 1px rgba(255,255,255,.25) inset;position:relative;overflow:hidden}
        .login-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent);transition:left .6s}
        .login-btn:hover::before{left:100%}
